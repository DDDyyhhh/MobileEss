# First ground test: reviewed short corridor only. No automatic goals.
amcl:
  ros__parameters:
    enabled: false
    tf_broadcast: false
map_server:
  ros__parameters:
    yaml_filename: ''
    topic_name: map
    frame_id: map
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
controller_server:
  ros__parameters:
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 13
      model_dt: 0.2
      batch_size: 300
      iteration_count: 1
      vx_max: 0.1
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.2
      ax_max: 0.35
      ax_min: -0.5
      ay_max: 0.0
      az_max: 0.5
      prune_distance: 2.0
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      visualize: false
      vx_std: 0.2
      wz_std: 0.4
      TrajectoryVisualizer.trajectory_step: 50
      TrajectoryVisualizer.time_step: 5
      regenerate_noises: false
      retry_attempt_limit: 0
      critics:
      - ConstraintCritic
      - ObstaclesCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic.cost_power: 1
      ConstraintCritic.cost_weight: 4.0
      ObstaclesCritic.consider_footprint: true
      ObstaclesCritic.cost_power: 1
      ObstaclesCritic.repulsion_weight: 3.0
      ObstaclesCritic.critical_weight: 30.0
      ObstaclesCritic.collision_cost: 1000000.0
      ObstaclesCritic.collision_margin_distance: 0.2
      ObstaclesCritic.near_goal_distance: 0.5
      ObstaclesCritic.inflation_radius: 0.9
      ObstaclesCritic.cost_scaling_factor: 5.0
      CostCritic.consider_footprint: true
      CostCritic.cost_power: 1
      CostCritic.cost_weight: 5.0
      CostCritic.critical_cost: 300.0
      CostCritic.collision_cost: 1000000.0
      CostCritic.near_goal_distance: 0.5
      CostCritic.inflation_layer_name: inflation_layer
      GoalCritic.cost_power: 1
      GoalCritic.cost_weight: 5.0
      GoalAngleCritic.cost_power: 1
      GoalAngleCritic.cost_weight: 3.0
      PathAlignCritic.cost_power: 1
      PathAlignCritic.cost_weight: 3.0
      PathAlignCritic.threshold_to_consider: 0.5
      PathFollowCritic.cost_power: 1
      PathFollowCritic.cost_weight: 3.0
      PathFollowCritic.threshold_to_consider: 1.4
      PathAngleCritic.cost_power: 1
      PathAngleCritic.cost_weight: 2.0
      PreferForwardCritic.cost_power: 1
      PreferForwardCritic.cost_weight: 5.0
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
waypoint_follower:
  ros__parameters:
    loop_rate: 10
    stop_on_failure: true
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.1
    - 0.0
    - 0.2
    min_velocity:
    - 0.0
    - 0.0
    - -0.2
    max_accel:
    - 0.35
    - 0.0
    - 0.4
    max_decel:
    - -0.5
    - 0.0
    - -0.5
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      resolution: 0.1
      footprint: '[[0.54303, 0.384], [-0.54303, 0.384], [-0.54303, -0.384], [0.54303,
        -0.384]]'
      footprint_padding: 0.02
      track_unknown_space: true
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.9
        cost_scaling_factor: 4.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.5
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: '[[0.54303, 0.384], [-0.54303, 0.384], [-0.54303, -0.384], [0.54303,
        -0.384]]'
      footprint_padding: 0.02
      footprint_clearing_enabled: true
      plugins:
      - static_layer
      - timed_dynamic_layer
      - inflation_layer
      always_send_full_costmap: true
      timed_dynamic_layer:
        plugin: timed_dynamic_obstacle_layer::TimedDynamicObstacleLayer
        enabled: true
        topic: /nav2/mid360_obstacles
        ttl_seconds: 0.8
        obstacle_cell_size: 0.05
        transform_tolerance: 0.5
        source_timeout: 0.6
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.9
        cost_scaling_factor: 5.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: false
