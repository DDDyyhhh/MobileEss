amcl:
  ros__parameters:
    enabled: false
    tf_broadcast: false

map_server:
  ros__parameters:
    # Humble's bringup rewrites this existing key from its map launch argument.
    yaml_filename: ""
    topic_name: map
    frame_id: map

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

controller_server:
  ros__parameters:
    # The RK3588 still missed 100 ms controller deadlines. Humble requires
    # controller period <= model_dt, so use matching 200 ms periods. The
    # 13-step model keeps a >= 2.5 s look-ahead; the final Collision Gate
    # continues to predict at 50 ms independently of this optimization rate.
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    # A dynamic obstacle with no collision-free local trajectory must stop
    # immediately; do not reuse the last nonzero command during the failure
    # tolerance window.
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 13
      model_dt: 0.20
      # 13 x 0.20 s keeps a 2.6 s horizon within RK3588's CPU budget.
      batch_size: 300
      iteration_count: 1
      vx_max: 0.35
      vx_min: -0.20
      vy_max: 0.0
      wz_max: 0.50
      ax_max: 0.35
      ax_min: -0.50
      ay_max: 0.0
      az_max: 0.50
      prune_distance: 2.0
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      # Keep visualisation disabled during ordinary operation. The supervised
      # capture script enables it temporarily while CAN command output is off.
      visualize: false
      # Make Humble's default noise distribution explicit. A capture determines
      # whether these samples produce viable left/right bypasses before tuning.
      vx_std: 0.20
      wz_std: 0.40
      # When visualisation is temporarily enabled, downsample the 1000-member
      # population so candidate markers remain within RK3588 debug budget.
      TrajectoryVisualizer.trajectory_step: 50
      TrajectoryVisualizer.time_step: 5
      regenerate_noises: false
      # A fully colliding population must fail once and stop immediately;
      # retries double the worst-case CPU time without creating free space.
      retry_attempt_limit: 0
      critics: [ConstraintCritic, ObstaclesCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic.cost_power: 1
      ConstraintCritic.cost_weight: 4.0
      # Humble ObstaclesCritic checks the real circular footprint here. Its
      # potential-field parameters must match the local InflationLayer.
      ObstaclesCritic.consider_footprint: false
      ObstaclesCritic.cost_power: 1
      ObstaclesCritic.repulsion_weight: 3.0
      ObstaclesCritic.critical_weight: 30.0
      ObstaclesCritic.collision_cost: 1000000.0
      ObstaclesCritic.collision_margin_distance: 0.20
      ObstaclesCritic.near_goal_distance: 0.50
      ObstaclesCritic.inflation_radius: 0.65
      ObstaclesCritic.cost_scaling_factor: 5.0
      CostCritic.consider_footprint: false
      CostCritic.cost_power: 1
      CostCritic.cost_weight: 5.0
      CostCritic.critical_cost: 300.0
      CostCritic.collision_cost: 1000000.0
      CostCritic.near_goal_distance: 0.50
      CostCritic.inflation_layer_name: inflation_layer
      GoalCritic.cost_power: 1
      GoalCritic.cost_weight: 5.0
      GoalAngleCritic.cost_power: 1
      GoalAngleCritic.cost_weight: 3.0
      PathAlignCritic.cost_power: 1
      # Candidate samples already include a wider safe bypass than the chosen
      # curve in observation mode. Reduce static-plan alignment pressure so
      # MPPI can select that local bypass; keep all turning and collision limits
      # unchanged for this single-variable field trial.
      PathAlignCritic.cost_weight: 3.0
      PathAlignCritic.threshold_to_consider: 0.5
      PathFollowCritic.cost_power: 1
      # Second single-variable trial: reduce endpoint pull toward the static
      # global path so a locally safe bypass can remain laterally displaced.
      PathFollowCritic.cost_weight: 3.0
      PathFollowCritic.threshold_to_consider: 1.4
      PathAngleCritic.cost_power: 1
      PathAngleCritic.cost_weight: 2.0
      PreferForwardCritic.cost_power: 1
      PreferForwardCritic.cost_weight: 5.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.10
      use_astar: true
      allow_unknown: false

behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:
    loop_rate: 10
    stop_on_failure: true

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.70, 0.0, 0.50]
    min_velocity: [-0.30, 0.0, -0.50]
    max_accel: [0.35, 0.0, 0.40]
    max_decel: [-0.50, 0.0, -0.50]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      resolution: 0.10
      robot_radius: 0.45
      track_unknown_space: true
      # The global map is a fixed planning asset. Live Mid-360 observations
      # belong only to the rolling local costmap; putting them here makes
      # transient returns accumulate in map coordinates and permanently alter
      # the global planner's view while the vehicle moves.
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Keep the physical 0.45 m radius plus a modest planning margin. A
        # steeper field avoids turning isolated static-map cells into broad
        # low-cost blobs that close otherwise traversable channels.
        inflation_radius: 0.65
        cost_scaling_factor: 4.0

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.5
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.45
      footprint_clearing_enabled: true
      # Dynamic Livox occupancy is local-only and TTL-owned. Do not retain an
      # ObstacleLayer here: fixed-origin Bresenham clearing leaves unobserved
      # human-outline cells when the vehicle is stationary. The timed layer
      # directly expires its own transient cells and never changes /map or the
      # static/global costmap.
      plugins: [timed_dynamic_layer, inflation_layer]
      always_send_full_costmap: true
      timed_dynamic_layer:
        plugin: timed_dynamic_obstacle_layer::TimedDynamicObstacleLayer
        enabled: true
        topic: /nav2/mid360_obstacles
        ttl_seconds: 0.80
        obstacle_cell_size: 0.05
        transform_tolerance: 0.5
        # Hold existing local obstacles if Livox evidence or its TF path goes
        # stale; TTL expiry advances only while current input is healthy.
        source_timeout: 0.6
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Keep the 0.45 m collision radius plus 0.20 m local tracking buffer.
        # Do not set this below robot_radius: that would remove the safety margin.
        inflation_radius: 0.65
        cost_scaling_factor: 5.0
