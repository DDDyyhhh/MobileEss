amcl:
  ros__parameters:
    enabled: false
    tf_broadcast: false
map_server:
  ros__parameters:
    yaml_filename: ''
    topic_name: map
    frame_id: map
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    transform_tolerance: 0.5
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: /home/cat/MobileEss_ws/install/mower_nav2/share/mower_nav2/behavior_trees/navigate_to_pose_dwb_comparison.xml
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - position_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: true
      min_vel_x: 0.0
      max_vel_x: 0.2
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.2
      min_speed_theta: 0.0
      acc_lim_x: 0.35
      acc_lim_y: 0.0
      acc_lim_theta: 0.5
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -0.5
      vx_samples: 5
      vy_samples: 1
      vtheta_samples: 11
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.02
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - ObstacleFootprint
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      ObstacleFootprint.scale: 1.0
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 16.0
      GoalDist.scale: 12.0
      RotateToGoal.scale: 8.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
    position_goal_checker:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.25
      stateful: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
waypoint_follower:
  ros__parameters:
    loop_rate: 10
    stop_on_failure: true
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.2
    - 0.0
    - 0.5
    min_velocity:
    - 0.0
    - 0.0
    - -0.5
    max_accel:
    - 0.35
    - 0.0
    - 0.4
    max_decel:
    - -0.5
    - 0.0
    - -0.5
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      resolution: 0.1
      robot_radius: 0.45
      track_unknown_space: true
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 4.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.5
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.45
      footprint_clearing_enabled: true
      plugins:
      - timed_dynamic_layer
      - inflation_layer
      always_send_full_costmap: true
      timed_dynamic_layer:
        plugin: timed_dynamic_obstacle_layer::TimedDynamicObstacleLayer
        enabled: true
        topic: /nav2/mid360_obstacles
        ttl_seconds: 0.8
        obstacle_cell_size: 0.05
        transform_tolerance: 0.5
        source_timeout: 0.6
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.65
        cost_scaling_factor: 5.0
