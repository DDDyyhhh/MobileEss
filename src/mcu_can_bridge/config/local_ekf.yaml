ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /fast_lio/odometry
    odom0_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: /livox/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 50
    imu0_remove_gravitational_acceleration: false

    twist0: /wheel/odometry/twist
    twist0_config: [false, false, false,
                    false, false, false,
                    true, false, false,
                    false, false, false,
                    false, false, false]
    # Four-wheel skid yaw is terrain/motion dependent. IMU + LIO own yaw;
    # wheel linear.x remains an observation. Keep wheel yaw for diagnostics.
    twist0_differential: false
    twist0_relative: false
    twist0_queue_size: 10
