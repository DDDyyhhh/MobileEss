notes: >-
  Vehicle returned to map-capture start pose before saving. The initial static
  observation bag omitted /cloud_registered and /fixed_map_localization/odometry.
  The corrected recheck bag is 252.035 s with 2512 cloud and FAST-LIO messages,
  239 ICP outputs, fitness 0.014688-0.019772, candidate spans of 0.014216 m x,
  0.011843 m y, and 0.048 deg yaw, 117 RTK quality-4 fixes, connected NTRIP,
  and zero wheel speed. The first 272.160 s dynamic candidate bag provided 260
  continuous ICP outputs but did not pass the TF enable gate. Fitness reached
  0.29972 with four outputs above 0.10, point-turn vibration caused a 0.1809 m
  candidate step, and repeated vertical corrections reached 0.2886 m per step.
  The candidate returned close to its starting alignment, RTK/NTRIP remained
  stable, and no map -> odom TF was published. A smoother repeat that also
  records /odometry/filtered and covers the same independent route is required.
  The 687.096 s smooth repeat reduced peak speed to 0.908 m/s, strong point-turn
  time to 1.83 s, and moving vibration, but /fast_lio/odometry and
  /cloud_registered were absent and fixed-map ICP published zero messages. The
  local EKF yaw drifted 54.6 deg during the initial 150 s stationary interval
  without LIO pose correction. NTRIP recovered from two late disconnections. A
  third recording is required after all four localization topics pass a
  stationary rate and content preflight. The complete 442.860 s third recording
  contained FAST-LIO, registered cloud, local EKF, and 419 ICP outputs. Smooth
  driving, FAST-LIO/EKF continuity, RTK/NTRIP, TF ownership, and start/end
  closure passed, but ICP still produced six fitness values above 0.10, 17
  vertical steps above 0.10 m with a 0.263 m maximum, and a 0.131 m planar step.
  Fitness was effectively uncorrelated with vertical step magnitude. Further
  recording with the same six-degree-of-freedom localizer is not useful; ground
  vehicle constraints and per-update motion gates require implementation and
  replay validation before another live candidate test. The Mid-360 static TF
  was corrected from [0.35, 0.0, 0.45] to the operator measurement [0.17, 0.0,
  0.48]. The initial RTK measurement was the dual-antenna center at [-0.17,
  0.0, 0.70]. Follow-up measurement confirmed Ant1 on the right at [-0.17,
  -0.325, 0.70], and the localization launch defaults now use that Ant1
  transform when global localization is explicitly enabled.
  The constrained localizer now recomputes fitness after applying the planar
  constraint, bounds first alignment to 1.0 m and 30 deg from its initial guess,
  and validates positive runtime parameters. Isolated equivalent-timing replay
  produced 395 outputs, constrained fitness at or below 0.09917, fixed z, a
  0.0792 m maximum planar step, and no accepted update above either configured
  fitness or planar motion threshold.
  The live constrained recheck is stored at
  /home/cat/rosbags/fixed_map_dynamic_2026-08-10_v2/candidate_constrained_recheck
  (the requested name included a trailing "1", but the created directory did
  not). It is a 92.895 s complete bag with 87 constrained ICP outputs. The
  vehicle crossed a roughly 3 deg slope near the final parking area; FAST-LIO
  pitch changed by roughly 5-6 deg there, while constrained map->odom kept
  z=-0.0111 m, roll=-2.0895 deg, and pitch=1.4974 deg fixed.
  The final 85.128 s TF continuity recheck produced 80 ICP outputs with intervals
  0.966-1.136 s, fitness 0.01847-0.03300, maximum planar step 0.01367 m, no
  constrained z/roll/pitch motion, and stable RTK/NTRIP. It passed candidate
  continuity and permits a publish_tf=true observation only; Nav2 and autonomous
   motion remain blocked until unique TF ownership and RTK/NTRIP loss-recovery
   behavior are observed. The first 172.788 s publish_tf=true observation is at
   /home/cat/rosbags/fixed_map_tf_publish_2026-08-10_v2/observation. It recorded
   163 constrained ICP candidates and 164 map->odom TF transforms; every
   candidate had an exactly matching TF transform, no duplicate transform stamp
   conflicted, fitness was 0.02002-0.06068, maximum planar step was 0.07478 m,
   z was fixed, and local EKF/FAST-LIO remained continuous. RTK fixes were all
   quality 4 and NTRIP remained connected with no diagnostic error. However, one
   candidate and map->odom interval was 2.20003 s, exceeding the 1.2 s TF
   continuity requirement. Repeat the controlled TF-publish observation after
   diagnosing that missed localizer cycle. Nav2 and autonomous motion remain
   blocked; NTRIP loss/recovery behavior is also still unobserved. With every
   RK3588 CPU core locked to the performance governor, the 179.732 s repeat at
   /home/cat/rosbags/fixed_map_tf_publish_2026-08-10_v2/observation_repeat
   recorded 168 candidates and exactly matching map->odom TF transforms. Fitness
   was 0.01932-0.06120, the maximum planar step was 0.07010 m, z remained fixed,
   FAST-LIO and the local EKF were continuous, all 56 RTK fixes had quality 4,
   and NTRIP remained connected without error. It nevertheless had one 2.09994 s
   candidate/map->odom interval, exceeding the 1.2 s requirement. The recurring
   gap despite CPU locking is consistent with the localizer consuming a 1 Hz
   update slot when an ICP or motion-gate update is rejected, then publishing no
   transform because it only publishes accepted estimates. Add rejection
   observability and a bounded heartbeat for the last accepted transform before
   another TF-publish acceptance recording. Nav2 and autonomous motion remain
   blocked; NTRIP loss/recovery behavior is also still unobserved. The localizer
